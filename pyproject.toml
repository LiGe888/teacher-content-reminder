[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teacher-content-reminder"
version = "0.1.0"
description = "Timed content fetching and preview pipeline for teacher-focused English materials."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=6.10.0",
    "trafilatura>=1.8.0",
    "tenacity>=8.2.0"
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[project.scripts]
teacher-content-reminder = "teacher_content_reminder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
