[project]
name = "teacher-content-reminder"
timezone = "Asia/Shanghai"
default_review_mode = "manual"
max_daily_push = 2

[selection]
freshness_hours = 72
min_total_score = 75
queue_review_score_min = 75

[selection.content_mix]
current_events = 0.4
science_nature = 0.35
culture_history = 0.25

[audiences.junior]
cefr = "A2-B1"
passage_words = [120, 220]
question_count = 5
cloze_blanks = 8

[audiences.senior]
cefr = "B1-B2"
passage_words = [250, 450]
question_count = 5
cloze_blanks = 10

[audiences.adult]
cefr = "B2-C1"
passage_words = [400, 700]
question_count = 6
cloze_blanks = 12

[exercise_profiles.default]
enabled = ["reading_comprehension", "cloze_test"]
include_answers = true
include_explanations = true

[delivery]
channel = "dingtalk"
template = "morning_reading"
webhook_env = "DINGTALK_WEBHOOK_URL"
secret_env = "DINGTALK_SECRET"

[alerting]
enabled = true
channel = "dingtalk"
webhook_env = "DINGTALK_ALERT_WEBHOOK_URL"
secret_env = "DINGTALK_ALERT_SECRET"
min_interval_minutes = 30
notify_dispatch_failure = true
notify_source_failure = true
notify_scheduled_failure = true

[review]
auto_approve_score = 82
special_push_score = 90
limit_per_source = 1

[schedule]
weekday_only = true
morning_send_time = "07:30"
evening_send_time = "20:30"
allow_evening_send = true
evening_requires_special = true
min_hours_between_push = 6
send_window_minutes = 30

[llm]
provider = "router"
model = "mock-teacher-v1"
api_key_env = "OPENAI_API_KEY"
api_base_env = "OPENAI_BASE_URL"
timeout_seconds = 60
temperature = 0.2
primary_provider = "qwen"
fallback_providers = ["kimi", "deepseek"]
system_prompt = "You are a careful curriculum-content generator. Always respond with a single JSON object and do not add extra prose."
max_retries = 1

[llm.task_routes]
extract_facts = ["qwen", "deepseek", "kimi"]
generate_title_summary = ["qwen", "kimi", "deepseek"]
generate_reading_passage = ["qwen", "kimi", "deepseek"]
generate_reading_questions = ["qwen", "kimi", "deepseek"]
generate_cloze_test = ["qwen", "deepseek", "kimi"]

[providers.qwen]
enabled = true
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
model = "qwen-plus"
api_key_env = "DASHSCOPE_API_KEY"
timeout_seconds = 60
temperature = 0.2
json_mode = true

[providers.qwen.extra_body]
enable_thinking = false

[providers.deepseek]
enabled = true
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"
api_key_env = "DEEPSEEK_API_KEY"
timeout_seconds = 60
temperature = 0.2
json_mode = true

[providers.kimi]
enabled = true
base_url = "https://api.moonshot.cn/v1"
model = "kimi-k2.5"
api_key_env = "MOONSHOT_API_KEY"
timeout_seconds = 60
temperature = 1.0
json_mode = true

[providers.openai]
enabled = false
base_url = "https://api.openai.com/v1"
model = "gpt-5.4-mini"
api_key_env = "OPENAI_API_KEY"
timeout_seconds = 60
temperature = 0.2
json_mode = true

[generation]
default_audience = "senior"
default_exercise_profile = "default"
max_input_chars = 12000

[[sources]]
name = "nasa_news"
category = "science_nature"
type = "rss"
entry_url = "https://www.nasa.gov/news-release/feed/"
enabled = true
priority = 10
schedule_cron = "0,30 * * * *"

[[sources]]
name = "science_news"
category = "science_nature"
type = "html_list"
entry_url = "https://www.sciencenews.org/"
enabled = true
priority = 9
schedule_cron = "15 * * * *"

[[sources]]
name = "smithsonian_science"
category = "culture_history"
type = "html_list"
entry_url = "https://www.smithsonianmag.com/science-nature/"
enabled = true
priority = 8
schedule_cron = "25 * * * *"

[[sources]]
name = "ap_highlights"
category = "current_events"
type = "html_list"
entry_url = "https://apnews.com/"
enabled = true
priority = 8
schedule_cron = "10,40 * * * *"
